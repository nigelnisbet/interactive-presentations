<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Canvas Activity</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    #container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 20px;
      max-width: 800px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 24px;
    }

    p {
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }

    #game-canvas {
      width: 100%;
      border: 3px solid #667eea;
      border-radius: 8px;
      display: block;
      background: #f5f5f5;
      cursor: pointer;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    #score {
      font-size: 18px;
      font-weight: bold;
      color: #667eea;
      padding: 10px 20px;
      background: #f0f4ff;
      border-radius: 8px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="container">
    <h1>🎨 Demo Canvas Activity</h1>
    <p>Click anywhere on the canvas to place colored circles. Try to fill the canvas with beautiful patterns!</p>

    <canvas id="game-canvas" width="800" height="600"></canvas>

    <div class="controls">
      <div id="score">Circles: 0</div>
      <button id="clear-btn">Clear Canvas</button>
      <button id="random-btn">Random Colors</button>
    </div>
  </div>

  <script type="module" src="./game.ts"></script>
</body>
</html>
