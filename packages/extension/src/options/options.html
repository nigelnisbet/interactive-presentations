<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Presentations - Configuration</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #0077c8 0%, #005a9e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 500px;
      width: 100%;
      padding: 2.5rem;
    }

    h1 {
      color: #0077c8;
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #666;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    select {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #ddd;
      border-radius: 0.5rem;
      font-size: 1rem;
      background: white;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    select:focus {
      outline: none;
      border-color: #0077c8;
    }

    .info-box {
      background: #f0f8ff;
      border: 1px solid #b3d9ff;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }

    .info-box.success {
      background: #e8f5e9;
      border-color: #a5d6a7;
    }

    .info-box.error {
      background: #ffebee;
      border-color: #ef9a9a;
    }

    .info-label {
      font-weight: 600;
      color: #666;
      font-size: 0.875rem;
      margin-bottom: 0.25rem;
    }

    .info-value {
      color: #333;
      font-family: monospace;
      font-size: 0.95rem;
    }

    .info-row {
      margin-bottom: 0.75rem;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    button {
      width: 100%;
      padding: 0.875rem;
      background: #f7941d;
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #e07f0a;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    .status.success {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .status.error {
      background: #ffebee;
      color: #c62828;
    }

    .loading {
      text-align: center;
      color: #666;
      padding: 2rem;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #0077c8;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .current-config {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid #eee;
    }

    .current-config h3 {
      color: #0077c8;
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 Extension Configuration</h1>
    <p class="subtitle">Configure your personal session for the Conversation Tool</p>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Loading team members...</p>
    </div>

    <div id="form" style="display: none;">
      <div class="form-group">
        <label for="teamMember">Who are you?</label>
        <select id="teamMember">
          <option value="">-- Select your name --</option>
        </select>
      </div>

      <div id="sessionInfo" class="info-box" style="display: none;">
        <div class="info-row">
          <div class="info-label">Session Code:</div>
          <div class="info-value" id="sessionCode">-</div>
        </div>
        <div class="info-row">
          <div class="info-label">Personal URL:</div>
          <div class="info-value" id="personalUrl">-</div>
        </div>
        <div class="info-row">
          <div class="info-label">Presentation:</div>
          <div class="info-value">Conversation Tool</div>
        </div>
      </div>

      <button id="saveBtn" disabled>Save Configuration</button>

      <div id="status" style="display: none;"></div>

      <div id="currentConfig" class="current-config" style="display: none;">
        <h3>Current Configuration</h3>
        <div class="info-box success">
          <div class="info-row">
            <div class="info-label">Configured as:</div>
            <div class="info-value" id="currentName">-</div>
          </div>
          <div class="info-row">
            <div class="info-label">Session Code:</div>
            <div class="info-value" id="currentSessionCode">-</div>
          </div>
          <div class="info-row">
            <div class="info-label">Status:</div>
            <div class="info-value">✅ Active</div>
          </div>
        </div>
      </div>
    </div>

    <div id="error" style="display: none;" class="info-box error">
      <strong>Error loading team members</strong>
      <p id="errorMessage" style="margin-top: 0.5rem;"></p>
    </div>
  </div>

  <script type="module" src="./options.ts"></script>
</body>
</html>
